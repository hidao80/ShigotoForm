name: Setup Bun and install dependencies
description: Set up Takumi Guard and Bun, then install dependencies from the lockfile (shared by the audit, lint and test workflows)

runs:
  using: composite
  steps:
    - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest
    - run: bun install --frozen-lockfile
      shell: bash
