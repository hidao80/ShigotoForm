name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
